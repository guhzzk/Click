<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIGMA CLICKER 9000</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="floaters"></div>

  <header class="topbar">
    <div class="brand">SIGMA CLICKER <span>9000</span></div>
    <div class="topbar-right">
      <div id="relicBadge" class="relic-badge">💎 0 relíquias</div>
      <button id="resetBtn" class="reset-btn" title="Apagar tudo, inclusive relíquias">zerar tudo</button>
    </div>
  </header>

  <main class="stage">
    <div class="score-wrap">
      <div id="score" class="score">0</div>
      <div class="score-label">pontos de rizz</div>
      <div id="rateLabel" class="rate-label">+0/s automático</div>
      <div id="comboLabel" class="combo-label"></div>
    </div>

    <button id="blob" class="blob" aria-label="clique aqui">
      <span id="blobEmoji">🗿</span>
    </button>

    <div id="critBanner" class="crit-banner"></div>

    <button id="ascendBtn" class="ascend-btn" hidden></button>
  </main>

  <section class="shop">
    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="click">👊 clique</button>
      <button class="tab" data-tab="auto">⚙️ automático</button>
      <button class="tab" data-tab="luck">🍀 sorte</button>
      <button class="tab" data-tab="relic">💎 relíquias</button>
      <button class="tab" data-tab="ach">🏆 conquistas</button>
    </div>
    <div id="shopList" class="shop-list"></div>
  </section>

  <div id="toast" class="toast"></div>

  <script src="script.js"></script>
</body>
</html>
